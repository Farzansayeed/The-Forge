<!doctype html>
<html lang="en" data-theme="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="description" content="The Forge — a C × DSA roadmap tracker that fights back." />
    <link rel="icon" href="/hammer-anvil.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/logo-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <title>The Forge — C × DSA Roadmap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA: register the offline worker (production + local preview only —
      // the raw dev server never caches, its /src/ scripts + HMR ws would).
      // The dev sentinel: a built page loads hashed /assets/*, not /src/*.
      if (
        'serviceWorker' in navigator &&
        (location.protocol === 'https:' ||
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1') &&
        !document.querySelector('script[type="module"][src^="/src/"]')
      ) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(console.warn);
        });
      }
    </script>
  </body>
</html>
